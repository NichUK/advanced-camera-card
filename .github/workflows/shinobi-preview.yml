name: Shinobi private preview boundaries
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'vitest*.ts'
      - 'vite.config.ts'
      - 'yarn.lock'
      - '.github/workflows/shinobi-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
      - run: corepack yarn@4.9.1 install --immutable
      - run: corepack yarn@4.9.1 typecheck
      - run: corepack yarn@4.9.1 coverage --maxWorkers=2
      - run: corepack yarn@4.9.1 lint
      - run: corepack yarn@4.9.1 playwright install --with-deps chromium
      - run: corepack yarn@4.9.1 vitest run --config vitest.browser.config.ts
        env:
          VITEST_BROWSER: chromium
      - run: corepack yarn@4.9.1 build
      - run: corepack yarn@4.9.1 vite build --mode shinobi-preview
      - run: corepack yarn@4.9.1 vitest run --config vitest.preview.config.ts
        env:
          VITEST_BROWSER: chromium
      - run: corepack yarn@4.9.1 vitest run --config vitest.download.config.ts
        env:
          VITEST_BROWSER: chromium
